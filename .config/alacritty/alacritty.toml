
[window]
opacity=0.8
blur=true

[cursor]
#style = "beam"

[font]
size=10
# normal = { family = "AdwaitaMono", style = "Regular" }
# bold = { family = "DejaVuSansMono-Bold", style = "Regular" }
# italic = { family = "DejaVuSansMono-Oblique", style = "Regular" }
# bold_italic = { family = "DejaVuSansMono-BoldOblique", style = "Regular" }

[keyboard]
bindings = [
   { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" }
]


[[hints.enabled]]
regex = "[^ ]+\\.rs:\\d+:\\d+"
command = { program = "code", args = [ "--goto" ] }
mouse = { enabled = true }

[general]
#[general];
live_config_reload = true
import = [
  "~/.config/alacritty/themes/iceberg-dark.toml"
  #"~/.config/alacritty/themes/iceberg-dark.toml"
]


