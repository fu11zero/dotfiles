git:
  pagers:
    - colorArg: always
      pager: delta --paging=never --line-numbers --side-by-side
  branchLogCmd: sh -c "git log --graph --color=always --abbrev-commit --decorate --oneline {{branchName}} --"
  allBranchesLogCmds:
    - sh -c "git log --graph --all --color=always --abbrev-commit --decorate --oneline | sed -e 's/\*/●/g' -e 's/|/│/g' -e 's@/@╯@g' -e 's/\\/╮/g'"
gui:
  # Required to ensure symbols and icons render correctly if you use Nerd Fonts
  nerdFontsVersion: "3"
  showFileTree: true
theme:
  activeBorderColor:
    - '#8bd5ca'
    - bold
  inactiveBorderColor:
    - '#a5adcb'
  optionsTextColor:
    - '#8aadf4'
  selectedLineBgColor:
    - '#363a4f'
  cherryPickedCommitBgColor:
    - '#494d64'
  cherryPickedCommitFgColor:
    - '#8bd5ca'
  unstagedChangesColor:
    - '#ed8796'
  defaultFgColor:
    - '#cad3f5'
  searchingActiveBorderColor:
    - '#eed49f'
  authorColors:
    '*': '#b7bdf8'
