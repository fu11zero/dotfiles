
autogenerated = 0 # remove this line to remove the warning

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
monitor=DP-1, 1920x1080@144.00Hz, auto, auto
#monitor=DP-2, 1200x1024@75.03Hz, -1024x-199, auto, transform, 3


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
# $terminal = kitty -o allow_remote_control=yes
$terminal = ghostty
$fileManager = $terminal -e zsh -c "source ~/.zshrc && yazi"
$processMonitor = $terminal -e zsh -c "btop"
$music = $terminal -e zsh -c "source ~/.zshrc && yamusic"
$menu = hyprlauncher
# $menu = wofi -a --show drun --allow-images true --matching multi-contains --insensitive true --gtk-dark true


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprp hyprgraphicsaper & firefox
exec-once = ~/.config/hypr/scripts/track_children.sh
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = waybar
exec-once = udiskie &
exec-once = hyprnotify
exec-once = hyprland-per-window-layout
exec-once = hyprlauncher -d
# exec-once = dunst
exec-once = systemctl --user start hyprpolkitagent
exec-once = wl-paste --watch cliphist store
exec-once = wallpaper start
exec-once = nm-applet --indicator &
exec-once = gromit-mpx -a

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = QT_QPA_PLATFORMTHEME,qt6ct
# env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia 
env = SUDO_EDITOR,nvim

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 5

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
    # Отключает зацикливание фокуса (не дает прыгать с правого края на левый)
    no_focus_fallback = true
}

windowrule {
    name = orage-border-for-fullscreen
    match:fullscreen = true

    # FIXME: стату
    #border_color = rgba(fcce03bb) rgba(fc5e03bb) 45deg
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    #rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 5
        passes = 2

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global,        1,     10,    default
    animation = border,        1,     5.39,  easeOutQuint
    animation = windows,       1,     4.79,  easeOutQuint
    animation = windowsIn,     1,     4.1,   easeOutQuint, popin 87%
    animation = windowsOut,    1,     1.49,  linear,       popin 87%
    animation = fadeIn,        1,     1.73,  almostLinear
    animation = fadeOut,       1,     1.46,  almostLinear
    animation = fade,          1,     3.03,  quick
    animation = layers,        1,     3.81,  easeOutQuint
    animation = layersIn,      1,     4,     easeOutQuint, fade
    animation = layersOut,     1,     1.5,   linear,       fade
    animation = fadeLayersIn,  1,     1.79,  almostLinear
    animation = fadeLayersOut, 1,     1.39,  almostLinear
    animation = workspaces,    1,     1.94,  almostLinear, fade
    animation = workspacesIn,  1,     1.21,  almostLinear, fade
    animation = workspacesOut, 1,     1.94,  almostLinear, fade
    animation = zoomFactor,    1,     7,     quick

}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule {
#     name = no-gaps-wtv1
#     match:float = false
#     match:workspace = w[tv1]
#
#     border_size = 0
#     rounding = 0
# }
#
# windowrule {
#     name = no-gaps-f1
#     match:float = false
#     match:workspace = f[1]
#
#     border_size = 0
#     rounding = 0
# }

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    # pseudotile = true # Master switch for pseudotiling. Enabling is bound to SUPER + P in the keybinds section below
    preserve_split = true # You probably want this
    force_split = 2
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 2 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
    initial_workspace_tracking = true
    #background_color = 0x222222
    #focus_on_activate = true
    vrr=1
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us,ru
    kb_variant =
    kb_model =
    kb_options = grp:caps_toggle
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    
    # Potential steam fix
    special_fallthrough = false

    touchpad {
        natural_scroll = false
    }
}

cursor {
    no_hardware_cursors = true
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = SUPER CONTROL, escape, exec, uwsm stop
bind = SUPER, return, exec, $terminal
bind = SUPER SHIFT, return, exec, $fileManager
bind = SUPER, D, exec, gromit-mpx --visibility
bind = SUPER CONTROL, D, exec, gromit-mpx --toggle 
bind = SUPER SHIFT, D, exec, gromit-mpx --clear 
bind = SUPER, C, killactive,
bind = SUPER SHIFT, C, exec, hyprctl kill
bind = SUPER SHIFT, R, exec, hyprctl reload,
bind = SUPER, R, exec, resizeactive
bind = SUPER SHIFT, escape, exec, $processMonitor
bind = SUPER, apostrophe, exec, zen-browser -P "Default (release)"
bind = SUPER SHIFT, apostrophe, exec, zen-browser -P "Default Profile"
# bind = SUPER, Escape, exec, $processMonitor
bind = SUPER, M, exec, $music
bind = SUPER SHIFT, M, exec, webcam
bind = SUPER SHIFT, w, exec, wallpaper next
bind = SUPER, A, exec, ~/.config/hypr/scripts/audio-switch.sh
bind = , F10, pass, class:^(com\.obsproject\.Studio)$
 
# floating windows
bind = SUPER CONTROL, F, togglefloating
bind = SUPER, Tab, cyclenext,
bind = SUPER, Tab, bringactivetotop

# tabs
# bind = SUPER, T, togglegroup
bind = SUPER ALT, h, changegroupactive, b
bind = SUPER ALT, l, changegroupactive, f
bind = SUPER ALT SHIFT, h, movegroupwindow, b
bind = SUPER ALT SHIFT, l, movegroupwindow, f

bind = SUPER, space, exec, $menu

bind = SUPER SHIFT, P, pseudo, # dwindle
bind = SUPER, T, layoutmsg, togglesplit
bind = SUPER, B, setprop, active no_blur toggle
bind = SUPER SHIFT, F, fullscreen, 0
bind = SUPER, F, fullscreen, 1
bind = SUPER, P, pin

# Move focus with SUPER + arrow keys
bind = SUPER, h, movefocus, l
bind = SUPER, h, alterzorder, top

bind = SUPER, l, movefocus, r
bind = SUPER, l, alterzorder, top

bind = SUPER, k, movefocus, u
bind = SUPER, k, alterzorder, top

bind = SUPER, j, movefocus, d
bind = SUPER, j, alterzorder, top

# Move focus with SUPER + arrow keys
bind = SUPER SHIFT, h, movewindoworgroup, l
bind = SUPER SHIFT, l, movewindoworgroup, r
bind = SUPER SHIFT, k, movewindoworgroup, u
bind = SUPER SHIFT, j, movewindoworgroup, d

# Switch workspaces with SUPER + [0-9]
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Move active window to a workspace with SUPER + SHIFT + [0-9]
bind = SUPER SHIFT, 1, movetoworkspacesilent, 1
bind = SUPER SHIFT, 2, movetoworkspacesilent, 2
bind = SUPER SHIFT, 3, movetoworkspacesilent, 3
bind = SUPER SHIFT, 4, movetoworkspacesilent, 4
bind = SUPER SHIFT, 5, movetoworkspacesilent, 5
bind = SUPER SHIFT, 6, movetoworkspacesilent, 6
bind = SUPER SHIFT, 7, movetoworkspacesilent, 7
bind = SUPER SHIFT, 8, movetoworkspacesilent, 8
bind = SUPER SHIFT, 9, movetoworkspacesilent, 9
bind = SUPER SHIFT, 0, movetoworkspacesilent, 10

# Move workspace to monitor
bind = SUPER CONTROL SHIFT, h, movecurrentworkspacetomonitor, l
bind = SUPER CONTROL SHIFT, l, movecurrentworkspacetomonitor, r

# Example special workspace (scratchpad)
bind = SUPER, S, togglespecialworkspace, special
bind = SUPER SHIFT, S, movetoworkspacesilent, special

# Move/resize windows with SUPER + LMB/RMB and dragging
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Resize windows
#bind = SUPER, mouse_down, sendshortcut, SUPER CONTROL, k
#bind = SUPER, mouse_up, sendshortcut, SUPER CONTROL, j
binde = SUPER CONTROL, k, resizeactive, 0 -10%
binde = SUPER CONTROL, j, resizeactive, 0 10%
binde = SUPER CONTROL, h, resizeactive, -10% 0
binde = SUPER CONTROL, l, resizeactive, 10% 0

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-


# Screenshot
bind = , print, exec, hyprshot -m region
bind = SUPER, print, exec, hyprshot -m window -m active
bind = SHIFT, print, exec, hyprshot -m output -m active

# Clipboard
# bindel = SUPER, V, exec, cliphist list | wofi -S dmenu | cliphist decode | wl-copy
bind = SUPER, V, exec, cliphist list | hyprlauncher --dmenu | cliphist decode | wl-copy && sleep 0.1 && hyprctl dispatch sendshortcut CTRL SHIFT, V, activewindow

# Colorpicker
#bindel = SUPER, C, exec, hyprpicker | wl-copy


# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

windowrule {
    name = disable-blur-for-grommit-mpx
    match:class = ^(Gromit-mpx)$
    # no_blur = true
}
# windowrulev2 = tile, class:^(Minecraft\* .*)$

# windowrule {
#     # Ignore maximize requests from all apps. You'll probably like this.
#     name = suppress-maximize-events
#     match:class = .*
#
#     suppress_event = maximize
# }

windowrule {
    # Fix some dragging issues with XWayland
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false

    no_focus = true
}

# Hyprland-run windowrule
windowrule {
    name = move-hyprland-run

    match:class = hyprland-run

    move = 20 monitor_h-120
    float = yes
}

