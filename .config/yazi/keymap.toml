[[mgr.prepend_keymap]]
on   = [ "P" ]
run  = "link --relative"
desc = "Вставить как относительную симлинку"

[[mgr.prepend_keymap]]
on = [ "g", "p" ]
run = 'cd ~/Projects'
desc = "Перейти к проектам"

[[mgr.prepend_keymap]]
on = [ "g", "D" ]
run = 'cd /mnt/data'
desc = "Перейти к диску D:"

[[mgr.prepend_keymap]]
on   = [ "G" ]
run  = "plugin gvfs"
desc = "Вызвать меню gvfs"

[[mgr.prepend_keymap]]
on   = [ "g", "n" ]
run  = "plugin gvfs --args='network://'"
desc = "Открыть Сетевое окружение"

[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = "plugin gvfs --args='smb://'"
desc = "Открыть Samba/Windows сеть"

[[mgr.prepend_keymap]]
on = [ "g", "m" ]
run = 'cd /run/media/fullzero'
desc = "Перейти к смонтированным дискам"

[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"

[[mgr.prepend_keymap]]
on   = [ "A", "a", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "A", "a", "p" ]
run  = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on   = [ "A", "a", "h" ]
run  = "plugin compress -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on   = [ "A", "a", "l" ]
run  = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on   = [ "A", "a", "u" ]
run  = "plugin compress -phl"
desc = "Archive selected files (password+header+level)"
