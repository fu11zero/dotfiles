[[mgr.prepend_keymap]]
on   = [ "P" ]
run  = "link --relative"
desc = "Вставить как относительную симлинку"

[[mgr.prepend_keymap]]
on = [ "g", "p" ]
run = 'cd ~/Projects'
desc = "Перейти к проектам"

[[mgr.prepend_keymap]]
on = [ "g", "W" ]
run = 'cd /mnt/windows'
desc = "Перейти к диску C:"

[[mgr.prepend_keymap]]
on = [ "g", "D" ]
run = 'cd /mnt/data'
desc = "Перейти к диску D:"

[[mgr.prepend_keymap]]
on   = [ "N" ]
run  = "plugin gvfs"
desc = "Вызвать меню gvfs"

[[mgr.prepend_keymap]]
on   = [ "g", "n" ]
run  = "plugin gvfs --args='network://'"
desc = "Открыть Сетевое окружение"

[[mgr.prepend_keymap]]
on   = [ "g", "s" ]
run  = "plugin gvfs --args='smb://'"
desc = "Открыть Samba/Windows сеть"

[[mgr.prepend_keymap]]
on = [ "g", "m" ]
run = 'cd /run/media/fullzero'
desc = "Перейти к смонтированным дискам"

[[mgr.prepend_keymap]]
on  = ["M", "M"]
run = "plugin mount"

[[mgr.prepend_keymap]]
on   = ["M", "G"]
run  = "plugin gvfs --args=''"
desc = "Открыть меню GVFS"
[[mgr.prepend_keymap]]
on = [ "M", "m" ]
run = "plugin gvfs -- select-then-mount --jump"
desc = "Монтировать устройство и перейти в него"

[[mgr.prepend_keymap]]
on = [ "M", "u" ]
run = "plugin gvfs -- select-then-unmount --eject"
desc = "Размонтировать и извлечь устройство"

[[mgr.prepend_keymap]]
on = [ "g", "m" ]
run = "plugin gvfs -- jump-to-device"
desc = "Перейти к смонтированному устройству"
    
[[mgr.prepend_keymap]]
on = [ "`", "`" ]
run = "plugin gvfs -- jump-back-prev-cwd"
desc = "Вернуться назад"

[[mgr.prepend_keymap]]
on   = [ "A", "a", "a" ]
run  = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on   = [ "A", "a", "p" ]
run  = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on   = [ "A", "a", "h" ]
run  = "plugin compress -ph"
desc = "Archive selected files (password+header)"

[[mgr.prepend_keymap]]
on   = [ "A", "a", "l" ]
run  = "plugin compress -l"
desc = "Archive selected files (compression level)"

[[mgr.prepend_keymap]]
on   = [ "A", "a", "u" ]
run  = "plugin compress -phl"
desc = "Archive selected files (password+header+level)"

[[mgr.prepend_keymap]]
on   = [ "e", "f" ]
run  = 'shell "yazi-video-to-frames \"$1\"" --block=false'
desc = "Конвертировать видео в кадры для Meshroom"

[[mgr.prepend_keymap]]
on   = [ "y", "y" ]
run  = "yank"
desc = "Пометить файлы для копирования (Yank)"

[[mgr.prepend_keymap]]
on   = [ "y", "Y" ]
run  = "unyank"
desc = "Убрать метку для копирования (Yank)"

[[mgr.prepend_keymap]]
on   = [ "y", "p" ]
run  = "copy path"
desc = "Копировать абсолютный путь"

[[mgr.prepend_keymap]]
on   = [ "y", "d" ]
run  = "copy dirname"
desc = "Копировать путь к директории"

[[mgr.prepend_keymap]]
on   = [ "y", "f" ]
run  = "copy filename"
desc = "Копировать имя файла"

[[mgr.prepend_keymap]]
on   = [ "y", "n" ]
run  = "copy name_without_ext"
desc = "Копировать имя файла без расширения"

[[mgr.prepend_keymap]]
on   = [ "d", "d" ]
run  = "yank --cut"
desc = "Вырезать выбранные файлы (Cut)"

[[mgr.prepend_keymap]]
on   = [ "d", "t" ]
run  = "remove"
desc = "Переместить выбранные файлы в корзину"

[[mgr.prepend_keymap]]
on   = [ "d", "p" ]
run  = "remove --permanently"
desc = "Удалить файлы навсегда (безвозвратно)"

[[mgr.prepend_keymap]]
on   = [ "d", "D" ]
run  = "unyank"
desc = "Убрать метку для перемещения (Cut)"
