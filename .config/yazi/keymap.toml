[[mgr.prepend_keymap]]
on = [ "g", "p" ]
run = 'cd ~/Projects'
desc = "Перейти к проектам"

[[mgr.prepend_keymap]]
on = [ "g", "D" ]
run = 'cd /mnt/data'
desc = "Перейти к диску D:"

[[mgr.prepend_keymap]]
on = [ "g", "m" ]
run = 'cd /run/media/fullzero'
desc = "Перейти к смонтированным дискам"

[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"

